services:
  db:
    image: postgres:16-alpine
    container_name: disagro-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-disagro_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-disagro_pass}
      POSTGRES_DB: ${DB_NAME:-disagro_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-disagro_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disagro-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disagro-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-disagro_user}
      DB_PASSWORD: ${DB_PASSWORD:-disagro_pass}
      DB_NAME: ${DB_NAME:-disagro_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - disagro-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se embebe en el bundle en build time, así que debe
        # apuntar a la URL del backend tal como la ve el NAVEGADOR del
        # cliente (el puerto publicado en el host), no al nombre del
        # servicio dentro de la red de Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: disagro-frontend
    ports:
      - "3001:3000"
    depends_on:
      - api
    networks:
      - disagro-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  disagro-network:
    driver: bridge
